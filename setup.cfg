# flake8 and other tool configuration
[flake8]
max-line-length = 100
extend-ignore = E203, W503, E501
exclude = build, install, log, .git, __pycache__

[isort]
profile = black
line_length = 100
known_first_party = arm_description,arm_control,arm_vision,arm_ik,arm_planner,arm_agents,arm_vla,arm_learning,arm_dashboard

[mypy]
python_version = 3.10
ignore_missing_imports = True
warn_return_any = True
warn_unused_configs = True
