repos:

  # ── General file hygiene ──────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]    # allows custom YAML tags used by ROS2
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500] # catch accidental large file commits
        # (model weights should be in .gitattributes LFS, not committed directly)
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-case-conflict
      - id: no-commit-to-branch
        args: [--branch, main]  # never commit directly to main
        
  # ── Python formatting ─────────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.10
        args: [--line-length=100]
        exclude: ^(build/|install/|log/)
        
  # ── Python import sorting ─────────────────────────────────────
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]
        
  # ── Python linting ────────────────────────────────────────────
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args:
          - --max-line-length=100
          - --extend-ignore=E203,W503,E501
          - --exclude=build,install,log
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions
          
  # ── Conventional commit message enforcement ───────────────────
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat      # new feature
          - fix       # bug fix
          - docs      # documentation only
          - style     # formatting, no logic change
          - refactor  # code change that is neither fix nor feat
          - perf      # performance improvement
          - test      # adding or fixing tests
          - chore     # build process or auxiliary tool changes
          - ci        # CI/CD changes
          - release   # version bump, changelog
          - hotfix    # critical fix for production
          
  # ── YAML linting ─────────────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args:
          - --config-data={
              extends: default,
              rules: {
                line-length: {max: 120},
                document-start: disable,
                truthy: {allowed-values: [true, false]}
              }
            }
        exclude: ^(\.github/|esp32_firmware/)
        
  # ── Shell script linting ──────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        
  # ── C++ formatting ────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.6
    hooks:
      - id: clang-format
        types_or: [c, c++]
        args: [--style=file]  # uses .clang-format
