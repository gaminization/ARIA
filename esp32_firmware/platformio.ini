; ═══════════════════════════════════════════════════════════════
; ARIA ESP32 Firmware — PlatformIO Configuration
; ═══════════════════════════════════════════════════════════════
;
; Build & Upload:
;   pio run -e esp32dev --target upload
;
; Monitor serial:
;   pio device monitor -b 115200
;
; micro-ROS agent (run on PC):
;   ros2 run micro_ros_agent micro_ros_agent serial --dev /dev/ttyUSB0
;   (or for WiFi:)
;   ros2 run micro_ros_agent micro_ros_agent udp4 --port 8888
;
; ═══════════════════════════════════════════════════════════════

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ── micro-ROS for PlatformIO ──
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    madhephaestus/ESP32Servo@^0.13.0

; ── Build flags ──
build_flags =
    -DARDUINO_ESP32_DEV
    -DBOARD_HAS_PSRAM
    -DCONFIG_MICRO_ROS_APP_STACK=16384
    -DCONFIG_MICRO_ROS_APP_TASK_PRIO=5

; ── Board-specific overrides ──
; For Wemos D32 (alternative board):
; [env:wemos_d32]
; platform = espressif32
; board = wemos_d32
; framework = arduino
; monitor_speed = 115200
; lib_deps =
;     https://github.com/micro-ROS/micro_ros_platformio
;     madhephaestus/ESP32Servo@^0.13.0
; build_flags =
;     -DARDUINO_ESP32_DEV
