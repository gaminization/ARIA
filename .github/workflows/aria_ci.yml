# ═══════════════════════════════════════════════════════════════
# ARIA CI — Build, Test, Benchmark
# Triggers on push/PR to main branches + nightly schedule
# ═══════════════════════════════════════════════════════════════
name: ARIA CI

on:
  push:
    branches: [main, develop, 'stage/*', 'upgrade/*']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'   # Nightly at 2:00 AM UTC

env:
  ROS_DISTRO: humble
  PYTHONDONTWRITEBYTECODE: 1

jobs:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Job 1: Build all ROS2 packages
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup ROS2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-colcon-common-extensions
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y 2>/dev/null || true

      - name: Install Python dependencies
        run: |
          pip install ikpy roboticstoolbox-python scipy numpy
          pip install sqlalchemy pyyaml aiohttp websockets
          pip install h5py mlflow

      - name: Build workspace
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install \
            --cmake-args -DCMAKE_BUILD_TYPE=Release 2>&1

      - name: Verify build artifacts
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          echo "── Packages ──"
          ros2 pkg list | grep arm_
          echo "── Executables ──"
          ros2 pkg executables arm_ik
          ros2 pkg executables arm_vision | head -10
          ros2 pkg executables arm_agents | head -10

      - name: Cache install directory
        uses: actions/cache@v4
        with:
          path: install/
          key: aria-build-${{ github.sha }}

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Job 2: Unit tests (pure Python, no GPU)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup ROS2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov pytest-asyncio pytest-timeout
          pip install ikpy roboticstoolbox-python scipy numpy
          pip install sqlalchemy pyyaml aiohttp websockets h5py

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: install/
          key: aria-build-${{ github.sha }}

      - name: Run IK tests
        run: |
          source /opt/ros/humble/setup.bash
          PYTHONPATH="arm_ik:$PYTHONPATH" \
          python3 -m pytest arm_ik/tests/ -v --timeout=60 || true

      - name: Run planner tests
        run: |
          source /opt/ros/humble/setup.bash
          PYTHONPATH="arm_planner:$PYTHONPATH" \
          python3 -m pytest arm_planner/tests/ -v --timeout=60 || true

      - name: Run control tests
        run: |
          source /opt/ros/humble/setup.bash
          PYTHONPATH="arm_control:$PYTHONPATH" \
          python3 -m pytest arm_control/tests/ -v --timeout=60 || true

      - name: Coverage report
        run: |
          source /opt/ros/humble/setup.bash
          PYTHONPATH="arm_ik:arm_planner:arm_control:$PYTHONPATH" \
          python3 -m pytest \
            --cov=arm_ik --cov=arm_planner --cov=arm_control \
            --cov-report=xml --cov-report=term-missing \
            --timeout=60 || true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Job 3: Import validation
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  import_check:
    name: Import Check
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup ROS2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install dependencies
        run: pip install ikpy roboticstoolbox-python scipy sqlalchemy pyyaml

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: install/
          key: aria-build-${{ github.sha }}

      - name: Verify all modules import
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 -c "
          import importlib, sys
          modules = [
              'arm_ik.arm_ik.ik_node',
              'arm_planner.arm_planner.task_manager',
              'arm_planner.arm_planner.state_bus',
              'arm_planner.arm_planner.world_model_db',
              'arm_control.arm_control.servo_controller',
          ]
          failed = []
          for m in modules:
              try:
                  importlib.import_module(m)
                  print(f'  ✅ {m}')
              except Exception as e:
                  print(f'  ❌ {m}: {e}')
                  failed.append(m)
          if failed:
              sys.exit(1)
          print(f'All {len(modules)} imports OK')
          "

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Job 4: Nightly benchmarks (self-hosted GPU)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  benchmark:
    name: Performance Benchmarks
    runs-on: self-hosted
    needs: unit_tests
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Run IK benchmark
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 arm_ik/arm_ik/ik_benchmark_node.py \
            --output benchmark_ik_$(date +%Y%m%d).csv 2>/dev/null || true

      - name: Compare to baseline
        run: |
          python3 .github/scripts/compare_benchmarks.py \
            --current benchmark_ik_*.csv \
            --baseline benchmarks/baseline_ik.csv \
            --threshold 0.10 2>/dev/null || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark_*.csv
          retention-days: 90
