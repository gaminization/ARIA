# ═══════════════════════════════════════════════════════════════
# ARIA Servo Calibration Configuration
# Generated by: hardware_bringup_wizard.py
# Edit manually or re-run wizard to update.
# ═══════════════════════════════════════════════════════════════

# Timestamp of last calibration
calibrated_at: "2024-01-01T00:00:00"

# Joint names (must match URDF joint names)
joint_names:
  - waist_joint
  - shoulder_joint
  - elbow_joint
  - wrist_pitch_joint
  - wrist_roll_joint
  - gripper_joint

# ── Calibration offsets (degrees) ──────────────────────────────
# offset[i] = sim_angle - real_servo_angle
# Positive offset: real servo is behind sim by N degrees
# Negative offset: real servo is ahead of sim by N degrees
# Set by /aria/calibrate_offsets or hardware wizard Step 5
offsets_deg:
  - 0.0    # J1 Waist
  - 0.0    # J2 Shoulder
  - 0.0    # J3 Elbow
  - 0.0    # J4 Wrist Pitch
  - 0.0    # J5 Wrist Roll
  - 0.0    # J6 Gripper

# ── ADC calibration (for tapped pot feedback) ──────────────────
# adc_min: ADC reading when servo is at its minimum angle
# adc_max: ADC reading when servo is at its maximum angle
# Set by hardware wizard Step 4
adc_calibration:
  waist_joint:
    adc_min: 200
    adc_max: 3800
    range: 3600
  shoulder_joint:
    adc_min: 250
    adc_max: 3750
    range: 3500
  elbow_joint:
    adc_min: 300
    adc_max: 3700
    range: 3400
  wrist_pitch_joint:
    adc_min: 200
    adc_max: 3800
    range: 3600
  wrist_roll_joint:
    adc_min: 250
    adc_max: 3750
    range: 3500
  gripper_joint:
    adc_min: 200
    adc_max: 3800
    range: 3600

# ── Servo pulse width calibration (microseconds) ──────────────
# Adjust if servos don't reach full range or jitter at endpoints
pulse_calibration:
  MG995:
    min_pulse_us: 600
    max_pulse_us: 2400
  SG90:
    min_pulse_us: 500
    max_pulse_us: 2500

# ── Home position (degrees) ───────────────────────────────────
home_position_deg:
  - 0.0     # J1 Waist (center)
  - 90.0    # J2 Shoulder (upright)
  - 90.0    # J3 Elbow (90° bend)
  - 90.0    # J4 Wrist Pitch (level)
  - 90.0    # J5 Wrist Roll (neutral)
  - 20.0    # J6 Gripper (slightly open)
