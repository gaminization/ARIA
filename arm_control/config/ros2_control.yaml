# ═══════════════════════════════════════════════════════════════
# ros2_control Hardware Parameters
# Referenced by the URDF <ros2_control> tag hardware params
# and by the launch file for hardware mode.
# ═══════════════════════════════════════════════════════════════

aria_hardware:
  ros__parameters:
    # Mode selection
    use_sim: true            # true = Gazebo sim, false = ESP32 hardware

    # micro-ROS bridge topics (only used when use_sim = false). The ESP32
    # firmware (esp32_firmware/, node 'aria_esp32') exchanges JointState
    # messages in DEGREES on these topics; the serial/WiFi link itself is
    # carried by micro_ros_agent (see arm_bringup/launch/hardware.launch.py).
    command_topic: "/aria/servo_commands"
    state_topic: "/aria/servo_states"
    teach_topic: "/aria/teach_mode"
    state_timeout_s: 1.0     # treat feedback older than this as stale

    # Four arm axes followed by the gripper; there is no wrist-roll joint.
    joint_names:
      - waist_joint
      - shoulder_joint
      - elbow_joint
      - wrist_pitch_joint
      - gripper_joint

    # Home position in radians, in joint_names order
    home_position:
      - 0.0       # waist:       0° (center of -90..+90)
      - 0.0       # shoulder
      - 0.0       # elbow
      - 0.0       # wrist_pitch
      - 0.3491    # gripper: 20° (slightly open)
