# ═══════════════════════════════════════════════════════════════
# ARIA Controller Configuration
# For use with ros2_control + gazebo_ros2_control (Gazebo Classic 11)
# ═══════════════════════════════════════════════════════════════

# ── Controller Manager ─────────────────────────────────────────
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz — match gazebo physics step rate

    # Active controllers
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# ── Joint Trajectory Controller (4 arm joints + gripper) ──────
joint_trajectory_controller:
  ros__parameters:
    joints:
      - waist_joint
      - shoulder_joint
      - elbow_joint
      - wrist_pitch_joint
      - gripper_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0   # Hz
    action_monitor_rate: 20.0  # Hz

    allow_partial_joints_goal: false
    open_loop_control: true    # GazeboSystem handles position directly

    constraints:
      stopped_velocity_tolerance: 0.05  # rad/s
      goal_time: 0.0                    # 0 = no timeout

# ── Joint State Broadcaster (all 5 joints) ────────────────────
joint_state_broadcaster:
  ros__parameters:
    joints:
      - waist_joint
      - shoulder_joint
      - elbow_joint
      - wrist_pitch_joint
      - gripper_joint

    interfaces:
      - position
      - velocity
