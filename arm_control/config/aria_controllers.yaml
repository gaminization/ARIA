# ═══════════════════════════════════════════════════════════════
# ARIA Controller Configuration
# For use with ros2_control + gz_ros2_control
# ═══════════════════════════════════════════════════════════════

# ── Controller Manager ─────────────────────────────────────────
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Active controllers
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_action_controller:
      type: position_controllers/GripperActionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# ── Joint Trajectory Controller (5 arm joints) ────────────────
joint_trajectory_controller:
  ros__parameters:
    joints:
      - waist_joint
      - shoulder_joint
      - elbow_joint
      - wrist_pitch_joint
      - wrist_roll_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0   # Hz
    action_monitor_rate: 20.0  # Hz

    allow_partial_joints_goal: false
    open_loop_control: false

    constraints:
      stopped_velocity_tolerance: 0.01  # rad/s
      goal_time: 0.0                    # 0 = no timeout

    gains:
      # MG995 joints — higher gains for heavier servos
      waist_joint:
        p: 100.0
        d: 10.0
        i: 0.01
        i_clamp: 1.0
      shoulder_joint:
        p: 100.0
        d: 10.0
        i: 0.01
        i_clamp: 1.0
      elbow_joint:
        p: 100.0
        d: 10.0
        i: 0.01
        i_clamp: 1.0
      # SG90 joints — lighter gains for micro servos
      wrist_pitch_joint:
        p: 50.0
        d: 5.0
        i: 0.01
        i_clamp: 0.5
      wrist_roll_joint:
        p: 50.0
        d: 5.0
        i: 0.01
        i_clamp: 0.5

# ── Gripper Action Controller ─────────────────────────────────
gripper_action_controller:
  ros__parameters:
    joint: gripper_joint
    action_monitor_rate: 20.0  # Hz
    goal_tolerance: 0.01       # rad
    max_effort: 0.18           # Nm (SG90 max)
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0

# ── Joint State Broadcaster (all 6 joints) ────────────────────
joint_state_broadcaster:
  ros__parameters:
    joints:
      - waist_joint
      - shoulder_joint
      - elbow_joint
      - wrist_pitch_joint
      - wrist_roll_joint
      - gripper_joint

    interfaces:
      - position
      - velocity
